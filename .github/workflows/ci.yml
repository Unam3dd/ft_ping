name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build ft_ping
        run: make

      - name: Check binary
        run: test -x ft_ping && ./ft_ping -V

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ft_ping-bin
          path: ft_ping
          retention-days: 3

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build
        run: make

      - name: Run unit tests
        run: make test
